<nav class="navbar" [class.navbar-hidden]="isNavbarHidden()">
  <div class="navbar-container">
    <!-- Logo Section -->
    <div class="navbar-brand">
      <div class="logos">
        <img src="assets/logo-universidad.png" alt="Universidad" class="logo-universidad" />
        <div class="logos-divider"></div>
        <img src="assets/logo-UniDocs.png" alt="UniDocs" class="logo-UniDocs" />
      </div>
      <div class="brand-text">
        <h1>UniDocs</h1>
        <p>Sistema de Gestión Documental</p>
      </div>
    </div>

    <!-- Menu Toggle (Mobile) -->
    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Items -->
    <div class="navbar-menu" [class.active]="isMenuOpen">
      <ul class="nav-list">
        <li><a href="/" (click)="closeMenu()">Inicio</a></li>
        <li><a href="/colectivos" (click)="closeMenu()">Colectivos</a></li>
      </ul>

      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            class="search-input"
            placeholder="Buscar informes y documentos..."
            [(ngModel)]="searchQuery"
            (input)="onSearch()"
            (keyup.escape)="clearSearch()"
          />
          <button
            *ngIf="searchQuery() !== ''"
            class="clear-btn"
            (click)="clearSearch()"
            title="Limpiar búsqueda"
          >
            ✕
          </button>
        </div>

        <!-- Search Results Dropdown -->
        <div class="search-results" *ngIf="searchResults().length > 0">
          <div
            *ngFor="let result of searchResults()"
            class="search-result-item"
            (click)="selectResult(result)"
          >
            <span class="result-icon">{{ result.icon }}</span>
            <div class="result-info">
              <p class="result-title">{{ result.title }}</p>
              <p class="result-type">{{ result.type }}</p>
            </div>
          </div>
        </div>

        <!-- No Results Message -->
        <div class="search-no-results" *ngIf="isSearching() && searchResults().length === 0 && searchQuery() !== ''">
          <p>No se encontraron resultados para "{{ searchQuery() }}"</p>
        </div>
      </div>

      <!-- Right Actions -->
      <div class="navbar-actions">
        <!-- Login/Register Section (No autenticado) -->
        <div class="login-section" *ngIf="!isAuthenticated()">
          <!-- Login Button -->
          <a href="/login" class="btn-login">Iniciar Sesión</a>
          
          <!-- Register Link -->
          <p class="register-prompt">¿No tienes cuenta aún? <a href="/register" class="register-link">Regístrate</a></p>
        </div>

        <!-- Logout Section (Autenticado) -->
        <div class="logout-section" *ngIf="isAuthenticated()">
          <button class="btn-logout" (click)="handleLogout()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar Sesión
          </button>
        </div>

        <!-- Theme Toggle -->
        <button class="theme-toggle" (click)="toggleTheme()" [title]="isDarkMode() ? 'Modo claro' : 'Modo oscuro'">
          <svg *ngIf="!isDarkMode()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <!-- Sun Icon -->
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg *ngIf="isDarkMode()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <!-- Moon Icon -->
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Modal de Logout -->
<div class="logout-modal-overlay" *ngIf="isLoggingOut()">
  <div class="logout-modal-content">
    <div class="spinner-container">
      <svg class="spinner" width="60" height="60" viewBox="0 0 50 50">
        <circle
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-dasharray="31.4 94.2"
        />
      </svg>
    </div>
    <p class="logout-text">Cerrando sesión...</p>
  </div>
</div>
