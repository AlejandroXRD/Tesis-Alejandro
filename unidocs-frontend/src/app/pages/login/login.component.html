<div class="login-wrapper">
  <div class="login-card" [class.shake]="hasError">

    <!-- ===== Logo UniDocs ===== -->
    
    <div class="title-container">
      <div class="logoo">
      <div class="brand">
      <img
        src="/logo-UniDocs.png"
        alt="UniDocs Logo"
        class="brand-logo"
      />
    </div>
    </div>

   <div class="loginTitle">
     <h2 class="login-title">Iniciar Sesión</h2>
    <p class="login-subtitle">Sistema de Gestión Documental</p>
   </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">

      <!-- ===== Usuario ===== -->
      <div class="form-group">
        <label for="userName" class="form-label">Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            id="userName"
            type="text"
            class="form-input"
            autocomplete="username"
            [(ngModel)]="credentials.userName"
            (ngModelChange)="onInputChange()"
            name="userName"
            placeholder="Ingresa tu usuario"
            required
          />
        </div>
      </div>

      <!-- ===== Contraseña con toggle de visibilidad ===== -->
      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>

          <!-- El tipo cambia dinámicamente entre 'password' y 'text' -->
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-input input-with-toggle"
            autocomplete="current-password"
            [(ngModel)]="credentials.password"
            (ngModelChange)="onInputChange()"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
          />

          <!-- 👁️ Botón para mostrar/ocultar -->
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
            tabindex="-1"
          >
            @if (showPassword) {
              <!-- Icono ojo tachado (contraseña visible) -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <!-- Icono ojo normal (contraseña oculta) -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- ===== Alerta de error ===== -->
      @if (errorMessage) {
        <div class="error-alert" role="alert">
          <span class="error-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </span>
          <span class="error-text">{{ errorMessage }}</span>
        </div>
      }

      <!-- ===== Botón principal ===== -->
      <button
        type="submit"
        class="btn-submit"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>

      <!-- ===== Acción secundaria ===== -->
      <button
        type="button"
        class="btn-secondary"
        (click)="goHome()"
        [disabled]="isLoading()"
      >
        Volver al Inicio
      </button>
    </form>

    <p class="login-footer">
      ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
