  <!-- Building -->
  <rect x="30" y="40" width="40" height="35" fill="white" stroke="white" stroke-width="1"/>
  
  <!-- Windows -->
  <rect x="35" y="45" width="6" height="6" fill="#7c3aed"/>
  <rect x="45" y="45" width="6" height="6" fill="#7c3aed"/>
  <rect x="55" y="45" width="6" height="6" fill="#7c3aed"/>
  
  <rect x="35" y="55" width="6" height="6" fill="#7c3aed"/>
  <rect x="45" y="55" width="6" height="6" fill="#7c3aed"/>
  <rect x="55" y="55" width="6" height="6" fill="#7c3aed"/>
  
  <!-- Door -->
  <rect x="45" y="65" width="8" height="10" fill="#7c3aed" stroke="white" stroke-width="1"/>
  <circle cx="51" cy="70" r="1" fill="white"/>
  
  <!-- Roof -->
